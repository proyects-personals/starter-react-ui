name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-lint:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR Title: $PR_TITLE"

          if ! printf '%s\n' "$PR_TITLE" | grep -Eq \
            '^(feat|fix|chore|docs|refactor|ci|test|style)(\([a-z0-9-]+\))?: .+'; then
            echo "PR title must follow Conventional Commits."
            echo "Example: feat(auth): add login"
            exit 1
          fi

          echo "PR title is valid."